name: Agent release

on:
  push:
    branches:
      - "feature/notification-release"
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in dry-run artifacts
        required: true
        default: "0.1.0-dev"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: notifications/go.mod
          cache-dependency-path: notifications/go.sum
      - name: Validate source release
        run: ./scripts/verify-release.sh

  linux:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: notifications/go.mod
          cache-dependency-path: notifications/go.sum
      - name: Select release version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            VERSION="${GITHUB_REF_NAME#agent-v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="0.1.0-dev.${GITHUB_SHA:0:12}"
          fi
          [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || {
            echo "invalid agent version" >&2
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Linux agent
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" release
          (
            cd notifications
            CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
              go build -buildvcs=false -trimpath \
              -ldflags="-s -w -buildid= -X main.version=$VERSION" \
              -o "$package_dir/novascale-agent" ./cmd/novascale-agent
          )
          chmod 755 "$package_dir/novascale-agent"
          cp LICENSE "$package_dir/LICENSE"
          cp -R notifications/third_party_licenses "$package_dir/THIRD_PARTY_LICENSES"
          "$package_dir/novascale-agent" version | grep -Fx "$VERSION"
          archive="release/novascale-agent_${VERSION}_linux_${TARGET_ARCH}.tar.gz"
          tar -C "$package_dir" -czf "$archive" \
            novascale-agent LICENSE THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-14
    environment: agent-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: notifications/go.mod
          cache-dependency-path: notifications/go.sum
      - name: Select release version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            VERSION="${GITHUB_REF_NAME#agent-v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="0.1.0-dev.${GITHUB_SHA:0:12}"
          fi
          [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || {
            echo "invalid agent version" >&2
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build universal macOS agent
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/build"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$build_dir" "$package_dir" release
          for arch in arm64 amd64; do
            (
              cd notifications
              CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
                go build -buildvcs=false -trimpath \
                -ldflags="-s -w -buildid= -X main.version=$VERSION" \
                -o "$build_dir/novascale-agent-$arch" ./cmd/novascale-agent
            )
          done
          lipo -create \
            "$build_dir/novascale-agent-arm64" \
            "$build_dir/novascale-agent-amd64" \
            -output "$package_dir/novascale-agent"
          chmod 755 "$package_dir/novascale-agent"
          cp LICENSE "$package_dir/LICENSE"
          cp -R notifications/third_party_licenses "$package_dir/THIRD_PARTY_LICENSES"
          "$package_dir/novascale-agent" version | grep -Fx "$VERSION"
          lipo -verify_arch arm64 x86_64 "$package_dir/novascale-agent"
      - name: Import Developer ID identity
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          : "${CERTIFICATE_BASE64:?missing MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?missing MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD}"
          : "${NOTARY_KEY_BASE64:?missing APPLE_NOTARY_KEY_P8_BASE64}"

          keychain_path="$RUNNER_TEMP/agent-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application/{print $2; exit}'
          )"
          test -n "$signing_identity" || {
            echo "Developer ID Application identity not found" >&2
            exit 1
          }
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
      - name: Sign and notarize macOS agent
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${NOTARY_KEY_ID:?missing APPLE_NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?missing APPLE_NOTARY_ISSUER_ID}"

          binary="$RUNNER_TEMP/package/novascale-agent"
          archive="release/novascale-agent_${VERSION}_darwin_universal.zip"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/package" "$archive"
          notary_result="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$archive" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json \
            > "$notary_result"
          notary_status="$(
            python3 - "$notary_result" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as result_file:
              print(json.load(result_file).get("status", ""))
          PY
          )"
          if [[ "$notary_status" != "Accepted" ]]; then
            echo "notarization did not return Accepted (status: ${notary_status:-missing})" >&2
            exit 1
          fi
          echo "notarization status: Accepted"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-macos-universal
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs:
      - linux
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum novascale-agent_* > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "NovaScale notification agent ${GITHUB_REF_NAME#agent-v}" \
            --generate-notes \
            release/*
